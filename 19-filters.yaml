- name: print the name 
  hosts: local 
  connection: local 
  vars:
    topics: Linux,Ansible,Terraform,Shell
    names:
      - Janaki 
      - Rao 
      - Kona 
    topic: ANSIBLE
  tasks:
    - name:  print name 
      debug:
        msg : "{{ person_name | default ( 'Ramesh' )}}"
    - name:  print topics 
      debug:
        msg : "{{ topics | split( ',' ) }}"

    - name:  print full_name 
      debug:
        msg : "{{ names | join( ' ' ) }}"
    - name:  print full_name 
      debug:
        msg : "{{ topic | lower }}"