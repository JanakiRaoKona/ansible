- name: gathering facts
  hosts:  local 
  connection:  local 
  tasks: 
    - name: print gathering facts 
      debug: 
        msg: "{{ ansible_facts }}"

    - name: print OS Family
      debug: 
        msg: | 
        os_family: "{{ ansible_facts['os_family'] }}"
        default_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"
        default_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"


    - name: print system vendor
      debug: 
        msg: "{{ ansible_facts.system_vendor }}"
