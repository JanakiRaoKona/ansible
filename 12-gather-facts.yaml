- name: gathering facts
  hosts:  local 
  connection:  local 
  tasks: 
    - name: print gathering facts 
      debug: 
        msg: "{{ ansible_facts }}"

    - name: print OS Family
      debug: 
        msg: | 
        "{{ ansible_facts['os_family'] }}"
        "{{ ansible_facts.['system_vendor'] }}"
        "{{ ansible_facts.['system'] }}"


    - name: print system vendor
      debug: 
        msg: "{{ ansible_facts.system_vendor }}"
