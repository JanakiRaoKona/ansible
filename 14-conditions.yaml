- name: Conditions 
  hosts: local 
  connection: local 
  given_number: 20
  tasks:
    - name: print even number 
      debug: 
        msg: Give number is {{ given_number }} even
      when: given_number % 2 == 0

    - name: print odd number 
      debug: 
        msg: Give number is {{ given_number }} odd
      when: given_number % 2 != 0
      