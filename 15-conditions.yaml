- name: Print Os is RedHat or not 
  hosts: local 
  connection: local 
  tasks:
    - name: Install nginx in RedHat 
      dnf:
        name: nginx
        state: present 
      when: ansible_facts.os_family == "RedHat"

    - name: Install nginx in Ubuntu 
      dnf:
        name: nginx
        state: present 
      when: ansible_facts.os_family == "Ubuntu"
