- name: install packages 
  hosts: local 
  connection: local 
  become: yes
  vars:
    packages:
    - { name: "nginx" ,  state: "present" }
    - { name: "mysql" ,  state: "present" }
    - { name: "git" ,  state: "absent" }
    - { name: "net-tools" ,  state: "present" }
    - { name: "htop" ,  state: "absent" }

  

  
  tasks:
    - name:  Install packages 
      package:
        name: "{{ item.name }}"
        state: "{{ item.state }}" 
      loop: "{{ packages }}" 
