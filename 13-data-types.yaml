- name:  "Course information"
  hosts:  local 
  connection:  local 
  vars:
    course: "AIOps with DevSecops with AWs"
    duration_in_hurs: 150 # number or intigiger
    live_session: true # boolean
    topics: # list
      - linux
      - ansible
      - terraform 
    more_info: # dict /map
      trainer: Siva
      moths: 4 
    exact_duration_in_months: 4.5
  tasks:
    - name: print different vars with types 
      debug:
        msg: |
         name : "{{ course }} : {{ course | type_debug }}"
         name : "{{ duration_in_hurs }} : {{ duration_in_hurs | type_debug }}"

